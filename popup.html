<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Quiet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="brand-mark" aria-hidden="true">q</span><span>Spotify Quiet</span><span class="tag">CHROME · OPERA</span></header>
  <main>
    <p class="eyebrow">LESS INTERRUPTION</p>
    <h1>Just the<br>music.</h1>
    <section class="control" aria-label="Ad filtering">
      <div><p id="status">Connecting…</p><span id="detail">Reading your setting</span></div>
      <button id="toggle" class="toggle" type="button" role="switch" aria-checked="false" aria-label="Block Spotify ads" disabled><span></span></button>
    </section>
    <section class="stats" aria-label="Activity">
      <div><strong id="ads">0</strong><span>ads silenced</span></div>
      <div><strong id="sped">0</strong><span>sped through instead</span></div>
    </section>
    <p class="note" id="notice" role="status" aria-live="polite">Reload Spotify after changing this setting.</p>
    <div class="row">
      <button id="reload" class="reload" type="button" disabled>Reload tab <span aria-hidden="true">↻</span></button>
      <button id="report" class="reload" type="button" disabled>Copy report</button>
    </div>
    <div class="info"><span class="dot" aria-hidden="true"></span><p>Runs locally. Nothing leaves your browser.<br><span>The report holds hosts and timings only, no account data.</span></p></div>
  </main>
  <footer><span id="version">EXPERIMENTAL</span><button id="reset" class="link" type="button">Reset counts</button></footer>
  <script src="popup.js"></script>
</body>
</html>
